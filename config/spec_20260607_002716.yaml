        vlan: 99
      - name: Ethernet0/2
        ip: 13.13.13.1/30
    dhcp_pools:
      - name: CISCO_POOL
        network: 195.100.50.0/24
        gateway: 195.100.50.1
        dns: 8.8.8.8
        lease: 1
        excluded:
          - 195.100.50.1
          - 195.100.50.10
      - name: MGMT_POOL_IOU1
        network: 192.168.12.0/24
        gateway: 192.168.12.1
        dns: 8.8.8.8
        lease: 1
