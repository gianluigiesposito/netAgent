    hostname: IOU1
    banner: "Accesso riservato - NetAgent"
    enable_secret: cisco
    domain_name: netagent.local
    ssh_username: admin
    ssh_password: cisco
    ssh_timeout: 60
    ssh_retries: 3
    login_block_for: 120
    login_attempts: 3
    login_within: 60
    console_timeout: "10 0"
    vty_timeout: "10 0"
    vty_lines: "0 4"
    service_password_encryption: true
    interfaces:
      - name: Ethernet0/0
        ip: 12.12.12.2/30
      - name: Ethernet0/1
      - name: Ethernet0/1.50
