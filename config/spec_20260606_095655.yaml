devices:
  - name: R1
    profile: cisco_ios
    hostname: R1
    enable_secret: cisco
    domain_name: lab.local
    interfaces:
      - name: Ethernet0/0
        ip: 10.0.0.1/30
      - name: Ethernet0/1.10
        vlan_id: 10
        ip: 192.168.10.1/24
      - name: Ethernet0/1.20
        vlan_id: 20
        ip: 192.168.20.1/24
      - name: Ethernet0/1.99
        vlan_id: 99
        ip: 192.168.99.1/24
    static_routes:
      - network: 0.0.0.0/0
        next_hop: 10.0.0.2
  - name: R2
    profile: cisco_ios
    hostname: R2
    enable_secret: cisco
    interfaces:
      - name: Ethernet0/0
        ip: 10.0.0.2/30
    static_routes:
      - network: 192.168.10.0/24
        next_hop: 10.0.0.1
      - network: 192.168.20.0/24
        next_hop: 10.0.0.1
      - network: 192.168.99.0/24
        next_hop: 10.0.0.1
    dhcp_pools:
      - name: POOL_VLAN10
        network: 192.168.10.0/24
        gateway: 192.168.10.1
        dns: 8.8.8.8
        lease: 1
      - name: POOL_VLAN20
        network: 192.168.20.0/24
        gateway: 192.168.20.1
        dns: 8.8.8.8
        lease: 1
  - name: SW1
    profile: cisco_switch
    hostname: SW1
    vlans:
      10: USERS_10
      20: USERS_20
      99: MGMT
      999: NATIVE_VLAN
    interfaces:
      - name: Ethernet2/0
        channel_group: 1
        channel_mode: active
      - name: Ethernet2/1
        channel_group: 1
        channel_mode: active
      - name: Port-channel1
        mode: trunk
        trunk_vlans: [10, 20, 99]
        native_vlan: 999
      - name: Ethernet0/1
        mode: access
        access_vlan: 10
      - name: Ethernet0/2
        mode: access
        access_vlan: 10
      - name: Ethernet0/3
        mode: access
        access_vlan: 20
      - name: Ethernet1/0
        mode: access
        access_vlan: 20
      - name: Ethernet1/1
        mode: access
        access_vlan: 99
      - name: Vlan99
        ip: 192.168.99.2/24
  - name: SW2
    profile: cisco_switch
    hostname: SW2
    vlans:
      10: USERS_10
      20: USERS_20
      99: MGMT
      999: NATIVE_VLAN
    interfaces:
      - name: Ethernet0/0
        mode: trunk
        trunk_vlans: [10, 20, 99]
        native_vlan: 999
      - name: Ethernet2/0
        channel_group: 1
        channel_mode: active
      - name: Ethernet2/1
        channel_group: 1
        channel_mode: active
      - name: Port-channel1
        mode: trunk
        trunk_vlans: [10, 20, 99]
        native_vlan: 999
      - name: Vlan99
        ip: 192.168.99.3/24
  - name: PC1
    profile: vpcs
  - name: PC2
    profile: vpcs
  - name: PC3
    profile: vpcs
  - name: PC4
    profile: vpcs
  - name: PC5
    profile: vpcs
rollback_scope: all
